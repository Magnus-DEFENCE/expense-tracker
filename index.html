<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Expense Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ===================== AUTH VIEW ===================== -->
  <div id="authView" class="auth-wrapper">
    <div class="auth-card">
      <div class="brand">
        <span class="brand-icon">◆</span>
        <span class="brand-name">Expense Tracker</span>
      </div>

      <div class="auth-tabs">
        <button class="auth-tab active" id="loginTabBtn">Log In</button>
        <button class="auth-tab" id="signupTabBtn">Sign Up</button>
      </div>

      <form id="loginForm" class="auth-form">
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="you@example.com" required />
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="••••••••" required />
        <button type="submit" class="primary-btn">Log In</button>
      </form>

      <form id="signupForm" class="auth-form hidden">
        <label>Email</label>
        <input type="email" id="signupEmail" placeholder="you@example.com" required />
        <label>Password</label>
        <input type="password" id="signupPassword" placeholder="At least 6 characters" required minlength="6" />
        <button type="submit" class="primary-btn">Create Account</button>
      </form>

      <p id="authMsg" class="auth-msg"></p>
    </div>
  </div>

  <!-- ===================== APP VIEW ===================== -->
  <div id="appView" class="app hidden">
    <header>
      <div class="header-left">
        <span class="brand-icon small">◆</span>
        <h1>Expense Tracker</h1>
      </div>
      <div class="header-right">
        <span id="userEmail" class="user-email"></span>
        <button id="logoutBtn" class="ghost-btn">Log Out</button>
      </div>
    </header>

    <section class="summary-cards">
      <div class="card income">
        <span class="label">Total Income</span>
        <span class="amount" id="totalIncome">₱0.00</span>
      </div>
      <div class="card expense">
        <span class="label">Total Expense</span>
        <span class="amount" id="totalExpense">₱0.00</span>
      </div>
      <div class="card balance">
        <span class="label">Balance</span>
        <span class="amount" id="totalBalance">₱0.00</span>
      </div>
    </section>

    <section class="form-section">
      <h2>Add Transaction</h2>
      <form id="transactionForm">
        <div class="form-row">
          <select id="type" required>
            <option value="income">Income</option>
            <option value="expense">Expense</option>
          </select>
          <input type="number" id="amount" placeholder="Amount" step="0.01" min="0" required />
        </div>
        <div class="form-row">
          <input type="text" id="description" placeholder="Description (e.g. Grocery)" required />
          <input type="text" id="category" placeholder="Category (e.g. Food)" required />
        </div>
        <div class="form-row">
          <input type="date" id="date" required />
          <button type="submit" class="primary-btn">Add Transaction</button>
        </div>
      </form>
    </section>

    <section class="list-section">
      <h2>Transactions</h2>
      <div id="statusMsg" class="status-msg"></div>
      <table id="transactionTable">
        <thead>
          <tr>
            <th>Date</th>
            <th>Type</th>
            <th>Description</th>
            <th>Category</th>
            <th>Amount</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="transactionBody"></tbody>
      </table>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="app.js"></script>
</body>
</html>
