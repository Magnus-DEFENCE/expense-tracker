<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Expense Tracker</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="app">
    <header>
      <h1>💸 Expense Tracker</h1>
      <p class="subtitle">Track your income and expenses</p>
    </header>

    <section class="summary-cards">
      <div class="card income">
        <span class="label">Total Income</span>
        <span class="amount" id="totalIncome">₱0.00</span>
      </div>
      <div class="card expense">
        <span class="label">Total Expense</span>
        <span class="amount" id="totalExpense">₱0.00</span>
      </div>
      <div class="card balance">
        <span class="label">Balance</span>
        <span class="amount" id="totalBalance">₱0.00</span>
      </div>
    </section>

    <section class="form-section">
      <h2>Add Transaction</h2>
      <form id="transactionForm">
        <div class="form-row">
          <select id="type" required>
            <option value="income">Income</option>
            <option value="expense">Expense</option>
          </select>
          <input type="number" id="amount" placeholder="Amount" step="0.01" min="0" required />
        </div>
        <div class="form-row">
          <input type="text" id="description" placeholder="Description (e.g. Grocery)" required />
          <input type="text" id="category" placeholder="Category (e.g. Food)" required />
        </div>
        <div class="form-row">
          <input type="date" id="date" required />
          <button type="submit">Add Transaction</button>
        </div>
      </form>
    </section>

    <section class="list-section">
      <h2>Transactions</h2>
      <div id="statusMsg" class="status-msg"></div>
      <table id="transactionTable">
        <thead>
          <tr>
            <th>Date</th>
            <th>Type</th>
            <th>Description</th>
            <th>Category</th>
            <th>Amount</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="transactionBody">
          <!-- rows injected by JS -->
        </tbody>
      </table>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
